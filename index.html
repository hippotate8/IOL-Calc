<div class="app">
<header><div class="header-top"><div class="title"><h1>IOL Formula Selector</h1></div><div class="brand"><div class="logos"><img class="eom" src="eom_logo.png" alt="EOM"><img class="yes" src="yes_logo.png" alt="YES Eye Clinic"></div><div class="tagline">Biometry-Driven Formula Recommendation</div></div></div></header>
<main>
  <div class="eye-row"><div class="seg" aria-label="Eye selection"><button type="button" data-eye="" class="active">선택 안함</button><button type="button" data-eye="OD">OD</button><button type="button" data-eye="OS">OS</button></div></div>
  <div class="grid">
    <section class="card"><h2>Manual Input</h2><p class="sub">AL, K (or TK), ACD 값을 입력하세요.</p>
      <div class="field"><label for="al">AL <small>Axial Length</small></label><div class="input-wrap"><input id="al" type="number" step="0.01" inputmode="decimal" placeholder="예: 24.05"><span class="unit">mm</span></div></div>
      <div class="field"><label for="k">K (or TK) <small>Mean keratometry</small></label><div class="input-wrap"><input id="k" type="number" step="0.01" inputmode="decimal" placeholder="예: 43.00"><span class="unit">D</span></div></div>
      <div class="field"><label for="acd">ACD <small>Anterior Chamber Depth</small></label><div class="input-wrap"><input id="acd" type="number" step="0.01" inputmode="decimal" placeholder="예: 3.09"><span class="unit">mm</span></div></div>
      <button class="btn primary" id="recommendBtn">Recommend Formula</button>
    </section>
    <section class="card camera-card"><h2>Photo Recognition</h2><p class="sub">Biometry 화면 또는 출력물을 촬영하세요.</p>
      <label class="camera-zone" for="photoInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h3l1.4-2h7.2L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/></svg><strong>사진 찍기 / 불러오기</strong><span>인식된 AL, ACD, K/TK 값을 확인한 뒤 적용합니다.</span><img id="preview" alt="선택한 biometry 사진"></label>
      <input id="photoInput" type="file" accept="image/*" capture="environment"><div class="ocr-status" id="ocrStatus"></div>
      <div class="ocr-review" id="ocrReview"><h3>인식 결과 확인</h3><div class="ocr-device" id="ocrDevice"></div><div id="ocrSummary"></div><div id="kChoiceBox" style="display:none"><div style="font-size:13px;color:#667;margin-top:8px">K와 TK가 모두 인식되었습니다. 사용할 값을 선택하세요.</div><div class="choices" id="kChoices"></div></div><button class="btn primary" id="applyOcrBtn" type="button">입력창에 적용</button></div>
    </section>
  </div>
  <section class="result" id="result"><div class="result-head"><div class="recommended"><small>Recommended Formula</small><div class="formula" id="formula">—</div></div><div class="eye-tag" id="eyeTag" style="display:none"></div></div><div class="result-body"><div class="values-line"><div><span>AL</span><b id="rAl"></b></div><div><span>K/TK</span><b id="rK"></b></div><div><span>ACD</span><b id="rAcd"></b></div></div></div></section>
</main><div class="footer">© Hanguk EOM Inc. &amp; YES Eye Clinic.</div></div>
<script>
const FORMULA_TABLE=[[["Kane","EVO","EVO","Barrett"],["Kane","EVO","Barrett","Kane"],["EVO","EVO","Kane","Kane"],["EVO","EVO","Pearl-DGS","Kane"],["Hoffer QST","Barrett","Kane","Kane"],["K6","Hoffer QST","Kane","Kane"],["EVO","Hoffer QST","Kane","Kane"],["K6","EVO","Kane","Kane"]],[["K6","Kane","Kane","Barrett"],["K6","EVO","Barrett","Pearl-DGS"],["Hoffer QST","EVO","Pearl-DGS","Kane"],["K6","Barrett","Kane","Kane"],["K6","Hoffer QST","Kane","Kane"],["EVO","Hoffer QST","Kane","Kane"],["K6","EVO","Kane","Kane"],["Barrett","Pearl-DGS","Kane","Kane"]],[["Kane","EVO","Kane","EVO"],["Hoffer QST","EVO","Kane","Kane"],["K6","Kane","Kane","Kane"],["K6","Hoffer QST","Kane","Kane"],["EVO","Hoffer QST","Kane","Pearl-DGS"],["K6","Pearl-DGS","Kane","Pearl-DGS"],["K6","K6","Kane","Pearl-DGS"],["Barrett","Pearl-DGS","Hoffer QST","Pearl-DGS"]],[["Kane","Kane","EVO","EVO"],["K6","Kane","Kane","Kane"],["K6","EVO","Kane","Kane"],["K6","Hoffer QST","Kane","Pearl-DGS"],["Kane","EVO","Pearl-DGS","Pearl-DGS"],["K6","Hoffer QST","Kane","Pearl-DGS"],["Kane","Kane","Hoffer QST","Pearl-DGS"],["EVO","K6","Hoffer QST","Hoffer QST"]],[["K6","Kane","Kane","EVO"],["K6","Hoffer QST","Kane","Kane"],["Kane","EVO","Kane","Pearl-DGS"],["EVO","EVO","Kane","Pearl-DGS"],["Hoffer QST","Kane","Hoffer QST","Pearl-DGS"],["Pearl-DGS","Kane","Hoffer QST","EVO"],["Hoffer QST","Hoffer QST","Hoffer QST","Hoffer QST"],["Barrett","Kane","Kane","Hoffer QST"]],[["Kane","EVO","EVO","EVO"],["Kane","EVO","Kane","Pearl-DGS"],["Barrett","Hoffer QST","Kane","EVO"],["Kane","K6","Pearl-DGS","EVO"],["Hoffer QST","Kane","Hoffer QST","Barrett"],["K6","Hoffer QST","K6","Barrett"],["Kane","Hill-RBF","Barrett","Barrett"],["K6","Hoffer QST","Hoffer QST","Barrett"]],[["Kane","Kane","EVO","EVO"],["Kane","Hoffer QST","EVO","Pearl-DGS"],["Hoffer QST","Barrett","Pearl-DGS","Pearl-DGS"],["Kane","Kane","Hill-RBF","Pearl-DGS"],["Hoffer QST","Pearl-DGS","K6","Hill-RBF"],["Kane","K6","Hoffer QST","Hill-RBF"],["K6","Pearl-DGS","Hill-RBF","Barrett"],["K6","K6","Hill-RBF","Barrett"]],[["Kane","Kane","EVO","Pearl-DGS"],["Kane","EVO","Kane","Pearl-DGS"],["Barrett","K6","Hoffer QST","Pearl-DGS"],["EVO","K6","Hoffer QST","Pearl-DGS"],["Hoffer QST","Pearl-DGS","Kane","Hill-RBF"],["Kane","Barrett","EVO","Hill-RBF"],["Barrett","Barrett","EVO","Barrett"],["Barrett","Barrett","EVO","Barrett"]],[["Hoffer QST","EVO","EVO","Pearl-DGS"],["Hoffer QST","Pearl-DGS","K6","EVO"],["Hoffer QST","K6","K6","EVO"],["Barrett","Hill-RBF","K6","K6"],["Barrett","Pearl-DGS","Kane","Barrett"],["Barrett","Barrett","K6","Barrett"],["Barrett","Barrett","EVO","K6"],["Barrett","Hoffer QST","EVO","EVO"]],[["Hoffer QST","Kane","EVO","Pearl-DGS"],["Pearl-DGS","Hill-RBF","Barrett","Pearl-DGS"],["Hill-RBF","Pearl-DGS","Hill-RBF","K6"],["Barrett","K6","Kane","EVO"],["Barrett","Barrett","K6","Barrett"],["Barrett","K6","K6","Hill-RBF"],["Barrett","K6","EVO","Hill-RBF"],["Hoffer QST","Barrett","EVO","EVO"]],[["Barrett","K6","EVO","Pearl-DGS"],["Pearl-DGS","K6","Barrett","Hoffer QST"],["K6","Hoffer QST","Barrett","Kane"],["Kane","Barrett","Hoffer QST","Hoffer QST"],["Kane","EVO","Hoffer QST","K6"],["Pearl-DGS","Hoffer QST","Hill-RBF","Hoffer QST"],["Kane","EVO","Pearl-DGS","EVO"],["Barrett","EVO","Kane","EVO"]],[["Pearl-DGS","EVO","Pearl-DGS","Hoffer QST"],["EVO","Barrett","EVO","Hoffer QST"],["Hoffer QST","Barrett","EVO","K6"],["Hoffer QST","Barrett","EVO","Hoffer QST"],["Kane","EVO","Hoffer QST","EVO"],["Kane","Barrett","Kane","EVO"],["Barrett","EVO","Kane","EVO"],["Kane","EVO","EVO","Pearl-DGS"]],[["EVO","Hill-RBF","Hill-RBF","EVO"],["EVO","EVO","EVO","EVO"],["Kane","EVO","EVO","EVO"],["Hoffer QST","EVO","Barrett","Hill-RBF"],["Kane","EVO","Barrett","EVO"],["Kane","EVO","Barrett","EVO"],["Barrett","EVO","EVO","Pearl-DGS"],["Barrett","EVO","EVO","Pearl-DGS"]],[["Hoffer QST","EVO","Hill-RBF","Pearl-DGS"],["Pearl-DGS","EVO","EVO","Hoffer QST"],["Hoffer QST","Hoffer QST","EVO","EVO"],["Barrett","Barrett","K6","EVO"],["Barrett","Barrett","Kane","EVO"],["Kane","EVO","EVO","Pearl-DGS"],["Kane","EVO","EVO","Pearl-DGS"],["Kane","EVO","EVO","Pearl-DGS"]],[["Pearl-DGS","Pearl-DGS","Pearl-DGS","EVO"],["Hoffer QST","Hoffer QST","EVO","Pearl-DGS"],["Pearl-DGS","Hoffer QST","Hoffer QST","EVO"],["Barrett","Barrett","EVO","EVO"],["Pearl-DGS","EVO","EVO","Pearl-DGS"],["Pearl-DGS","EVO","EVO","Pearl-DGS"],["EVO","EVO","EVO","Pearl-DGS"],["Kane","EVO","Pearl-DGS","Kane"]],[["Barrett","Barrett","EVO","Pearl-DGS"],["Barrett","Barrett","EVO","EVO"],["Pearl-DGS","EVO","Barrett","K6"],["Barrett","EVO","Kane","K6"],["EVO","EVO","EVO","K6"],["EVO","EVO","EVO","Pearl-DGS"],["Pearl-DGS","Kane","Kane","Pearl-DGS"],["Kane","Kane","EVO","Kane"]],[["Pearl-DGS","Pearl-DGS","EVO","EVO"],["Kane","Pearl-DGS","EVO","K6"],["Barrett","Hoffer QST","Kane","EVO"],["Pearl-DGS","Barrett","EVO","K6"],["EVO","EVO","Pearl-DGS","EVO"],["Hoffer QST","EVO","EVO","K6"],["Pearl-DGS","Kane","Kane","Pearl-DGS"],["Pearl-DGS","Hoffer QST","Hoffer QST","K6"]],[["Kane","Pearl-DGS","Pearl-DGS","Pearl-DGS"],["Kane","Kane","Barrett","Hoffer QST"],["Barrett","Barrett","EVO","Pearl-DGS"],["Barrett","Hoffer QST","Pearl-DGS","Pearl-DGS"],["Hoffer QST","EVO","EVO","EVO"],["EVO","Pearl-DGS","Pearl-DGS","Pearl-DGS"],["Pearl-DGS","Pearl-DGS","Pearl-DGS","Pearl-DGS"],["Pearl-DGS","Pearl-DGS","EVO","Pearl-DGS"]],[["Kane","Pearl-DGS","EVO","Barrett"],["Pearl-DGS","Kane","EVO","EVO"],["Hoffer QST","Barrett","Hoffer QST","Hoffer QST"],["EVO","EVO","Hoffer QST","Hoffer QST"],["Pearl-DGS","EVO","Pearl-DGS","EVO"],["Pearl-DGS","EVO","Pearl-DGS","K6"],["EVO","K6","K6","K6"],["Pearl-DGS","Kane","Kane","Kane"]],[["Kane","Kane","Pearl-DGS","Barrett"],["Barrett","EVO","Kane","Barrett"],["Barrett","Barrett","EVO","Hoffer QST"],["Pearl-DGS","EVO","EVO","EVO"],["EVO","EVO","K6","K6"],["EVO","K6","K6","K6"],["EVO","Barrett","Kane","Barrett"],["K6","K6","K6","K6"]]];
let eye="";let lastKSource="K/TK";
document.querySelectorAll('[data-eye]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-eye]').forEach(x=>x.classList.remove('active'));b.classList.add('active');eye=b.dataset.eye;}));
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}function idx(v,min,step,count){let c=clamp(v,min,min+step*count);if(c>=min+step*count)return count-1;return Math.floor((c-min)/step)}function fmt(n,d=2){return Number(n).toFixed(d)}
function recommend(al,k,acd){const ai=idx(al,20,.5,20),ki=idx(k,40,1,8),di=idx(acd,2.25,.5,4);return FORMULA_TABLE[ai][ki][di]}
function showRecommendation(){const al=parseFloat(document.getElementById('al').value),k=parseFloat(document.getElementById('k').value),acd=parseFloat(document.getElementById('acd').value);if(!Number.isFinite(al)||!Number.isFinite(k)||!Number.isFinite(acd)||al<=0||k<=0||acd<=0){alert('AL, K (or TK), ACD 값을 모두 확인해주세요.');return}document.getElementById('formula').textContent=recommend(al,k,acd);document.getElementById('rAl').textContent=fmt(al)+' mm';document.getElementById('rK').textContent=fmt(k)+' D';document.getElementById('rAcd').textContent=fmt(acd)+' mm';const tag=document.getElementById('eyeTag');tag.style.display=eye?'block':'none';tag.textContent=eye;const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'})}
document.getElementById('recommendBtn').addEventListener('click',showRecommendation);['al','k','acd'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')showRecommendation()}));

let ocr={al:null,acd:null,k:null,tk:null,k1:null,k2:null,tk1:null,tk2:null,se:null,tse:null,selectedK:null,selectedSource:null,device:'Biometer'};
function cleanText(t){return String(t||'').replace(/,/g,'.').replace(/[|]/g,'I').replace(/\r/g,'').replace(/[‐‑‒–—]/g,'-')}
function numberFrom(s,min,max){if(!s)return null;const m=String(s).match(/-?\d{1,3}(?:\.\d{1,3})?/g)||[];for(const x of m){const n=parseFloat(x);if(n>=min&&n<=max)return n}return null}
function detectDevice(t){const u=t.toUpperCase();if(/IOL\s*MASTER|ZEISS|TSE|TK1|TK2/.test(u))return 'ZEISS IOLMaster 700';if(/LENSTAR|EYESUITE|HAAG/.test(u))return 'Haag-Streit Lenstar / EyeSuite';if(/ARGOS|ALCON|MOVU/.test(u))return 'Alcon ARGOS';if(/OA[- ]?2000|TOMEY/.test(u))return 'TOMEY OA-2000';if(/ALADDIN|TOPCON/.test(u))return 'Topcon Aladdin';if(/PENTACAM|OCULUS/.test(u))return 'OCULUS Pentacam AXL';if(/GALILEI|ZIEMER/.test(u))return 'Ziemer GALILEI';return 'Biometer'}
function findLabeled(t,patterns,min,max){const lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);for(const p of patterns){for(let i=0;i<lines.length;i++){p.lastIndex=0;if(p.test(lines[i])){const scopes=[lines[i],lines[i]+' '+(lines[i+1]||''),(lines[i-1]||'')+' '+lines[i]];for(const s of scopes){const n=numberFrom(s.replace(/(?:SD|S\.D\.).*$/i,''),min,max);if(n!=null)return n}}}}return null}
function metricAfterLabel(t,re,min,max){const m=t.match(re);if(!m)return null;const n=parseFloat((m[1]||'').replace(',','.'));return n>=min&&n<=max?n:null}
function pairMean(a,b){return a!=null&&b!=null?(a+b)/2:null}
function parseBiometry(text){const t=cleanText(text);const device=detectDevice(t);let al=findLabeled(t,[/\bAL\b/i,/AXIAL\s*(?:LENGTH|LEN)/i,/AXIAL\s*EYE\s*LENGTH/i],15,40);let acd=findLabeled(t,[/\bACD\b/i,/ANTERIOR\s*CHAMBER\s*DEPTH/i],1,8);
 const se=metricAfterLabel(t,/(?:^|\n)\s*S[E3]\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);const tse=metricAfterLabel(t,/(?:^|\n)\s*T[S5][E3]\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);
 const k1=metricAfterLabel(t,/(?:^|\s)K\s*1\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);const k2=metricAfterLabel(t,/(?:^|\s)K\s*2\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);const tk1=metricAfterLabel(t,/(?:^|\s)T\s*K\s*1\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);const tk2=metricAfterLabel(t,/(?:^|\s)T\s*K\s*2\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);
 let meanK=metricAfterLabel(t,/(?:^|\n)\s*(?:KM|K\s*MEAN|MEAN\s*K|AVG\.?\s*K|K\s*AVG)\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);let meanTK=metricAfterLabel(t,/(?:^|\n)\s*(?:TKM|TK\s*MEAN|MEAN\s*TK|AVG\.?\s*TK)\s*[:=]?\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);
 const genericK=metricAfterLabel(t,/(?:^|\n)\s*K\s*[:=]\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);const genericTK=metricAfterLabel(t,/(?:^|\n)\s*TK\s*[:=]\s*(\d{2}(?:\.\d{1,3})?)/im,30,60);
 if(meanK==null)meanK=genericK;if(meanTK==null)meanTK=genericTK;
 let k=null,tk=null;if(device==='ZEISS IOLMaster 700'){k=se!=null?se:(meanK!=null?meanK:pairMean(k1,k2));tk=tse!=null?tse:(meanTK!=null?meanTK:pairMean(tk1,tk2))}else{k=meanK!=null?meanK:pairMean(k1,k2);tk=meanTK!=null?meanTK:pairMean(tk1,tk2);if(k==null&&se!=null)k=se;if(tk==null&&tse!=null)tk=tse}
 // Low-resolution IOLMaster fallback: if ACD label was lost, use the first plausible 2.0–4.2 mm value after the AL line and before LT/WTW.
 if(acd==null&&(device==='ZEISS IOLMaster 700'||/\bSE\b/i.test(t))){const lines=t.split(/\n+/);let ai=lines.findIndex(x=>/\bAL\b/i.test(x));if(ai>=0){for(let i=ai+1;i<Math.min(lines.length,ai+4);i++){if(/\bLT\b|WTW/i.test(lines[i]))break;const nums=(lines[i].match(/\d{1,2}(?:\.\d{1,3})?/g)||[]).map(Number).filter(n=>n>=2&&n<=4.2);if(nums.length){acd=nums[0];break}}}}
 // Generic fallback for layouts whose ACD label OCR is damaged: select a plausible mm value near an ACD-like token.
 if(acd==null){const lines=t.split(/\n+/);for(const line of lines){if(/(?:A.?D|CHAMBER|DEPTH)/i.test(line)){const n=numberFrom(line,1,8);if(n!=null&&n<6){acd=n;break}}}}
 const selectedK=(k!=null&&tk!=null)?null:(tk!=null?tk:k);const selectedSource=(k!=null&&tk!=null)?null:(tk!=null?'TK':'K');return{al,acd,k,tk,k1,k2,tk1,tk2,se,tse,selectedK,selectedSource,device}}
function mergeOcr(a,b){if(!a)return b;if(!b)return a;const keys=['al','acd','k','tk','k1','k2','tk1','tk2','se','tse'];const out={...a};for(const k of keys)if(out[k]==null&&b[k]!=null)out[k]=b[k];if(out.device==='Biometer'&&b.device!=='Biometer')out.device=b.device;if(out.k!=null&&out.tk!=null){out.selectedK=null;out.selectedSource=null}else if(out.selectedK==null){out.selectedK=out.tk!=null?out.tk:out.k;out.selectedSource=out.tk!=null?'TK':'K'}return out}
function inferIOLMasterRightPairs(t){const vals=[];for(const line of cleanText(t).split(/\n+/)){if(!/@|°|D\b/i.test(line))continue;const ms=line.match(/\d{2}(?:\.\d{1,3})?/g)||[];for(const m of ms){const n=parseFloat(m);if(n>=38&&n<=55){vals.push(n);break}}}if(vals.length>=4)return{k1:vals[0],k2:vals[1],tk1:vals[2],tk2:vals[3]};return null}
function refreshDerivedIOLMaster(x){if(x.device!=='ZEISS IOLMaster 700')return x;if(x.se!=null)x.k=x.se;else if(x.k1!=null&&x.k2!=null)x.k=(x.k1+x.k2)/2;if(x.tk1!=null&&x.tk2!=null)x.tk=(x.tk1+x.tk2)/2;else if(x.tse!=null)x.tk=x.tse;if(x.k!=null&&x.tk!=null){x.selectedK=null;x.selectedSource=null}else{x.selectedK=x.tk!=null?x.tk:x.k;x.selectedSource=x.tk!=null?'TK':'K'}return x}
function renderOcr(){const rv=document.getElementById('ocrReview'),s=document.getElementById('ocrSummary'),kb=document.getElementById('kChoiceBox'),choices=document.getElementById('kChoices');document.getElementById('ocrDevice').textContent=ocr.device&&ocr.device!=='Biometer'?'Detected layout: '+ocr.device:'';const line=(name,val,unit,detail='')=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:4px 0"><b>${name}</b><span>${val!=null?Number(val).toFixed(2)+' '+unit+(detail?' · '+detail:''):'인식 안됨'}</span></div>`;let kDetail='';if(ocr.device==='ZEISS IOLMaster 700'&&ocr.se!=null)kDetail='SE';else if(ocr.k1!=null&&ocr.k2!=null)kDetail='K1/K2 mean';let tkDetail='';if(ocr.device==='ZEISS IOLMaster 700'&&ocr.tse!=null)tkDetail='TSE';else if(ocr.tk1!=null&&ocr.tk2!=null)tkDetail='TK1/TK2 mean';s.innerHTML=line('AL',ocr.al,'mm')+line('ACD',ocr.acd,'mm')+line('K',ocr.k,'D',kDetail)+(ocr.tk!=null?line('TK',ocr.tk,'D',tkDetail):'');choices.innerHTML='';kb.style.display=(ocr.k!=null&&ocr.tk!=null)?'block':'none';if(ocr.k!=null&&ocr.tk!=null){[['K',ocr.k],['TK',ocr.tk]].forEach(([n,v])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=`${n} ${v.toFixed(2)} D`;b.addEventListener('click',()=>{ocr.selectedK=v;ocr.selectedSource=n;choices.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')});choices.appendChild(b)})}rv.classList.add('show')}
function makeProcessedCanvas(img,mode='full'){let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;if(mode==='left'){sw=Math.max(1,Math.floor(img.naturalWidth*.58))}else if(mode==='right'){sx=Math.floor(img.naturalWidth*.46);sw=img.naturalWidth-sx}let scale=Math.max(1,Math.min(7,1800/sw));if(sw<500)scale=Math.min(8,scale*1.7);const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;let min=255,max=0;for(let i=0;i<p.length;i+=4){const g=Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2]);p[i]=p[i+1]=p[i+2]=g;if(g<min)min=g;if(g>max)max=g}const span=Math.max(24,max-min);for(let i=0;i<p.length;i+=4){let g=(p[i]-min)*255/span;g=(g-128)*1.55+128;g=Math.max(0,Math.min(255,g));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return c}
async function loadImageFile(file){return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=reject;img.src=u})}
async function loadTesseract(){if(window.Tesseract)return true;document.getElementById('ocrStatus').textContent='사진 인식 엔진을 불러오는 중…';return new Promise(resolve=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function runOCR(canvas,status,prefix){const r=await Tesseract.recognize(canvas,'eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`${prefix} ${Math.round((m.progress||0)*100)}%`}});return r.data.text||''}
document.getElementById('photoInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const p=document.getElementById('preview');p.src=URL.createObjectURL(f);p.style.display='block';const status=document.getElementById('ocrStatus');status.textContent='사진 분석 준비 중…';const ok=await loadTesseract();if(!ok){status.textContent='자동 인식 엔진을 불러오지 못했습니다. 직접 입력은 정상 사용 가능합니다.';return}try{const img=await loadImageFile(f);const full=makeProcessedCanvas(img,'full');const left=makeProcessedCanvas(img,'left');const t1=await runOCR(full,status,'전체 화면 인식 중…');let parsed=parseBiometry(t1);if(parsed.al==null||parsed.acd==null||parsed.k==null){const t2=await runOCR(left,status,'측정값 영역 재확인 중…');parsed=mergeOcr(parsed,parseBiometry(t2))}if(parsed.device==='ZEISS IOLMaster 700'||/\b(?:SE|TSE|TK)\b/i.test(t1)){const right=makeProcessedCanvas(img,'right');const t3=await runOCR(right,status,'K/TK 영역 재확인 중…');parsed=mergeOcr(parsed,parseBiometry(t3));const pairs=inferIOLMasterRightPairs(t3);if(pairs){for(const key of ['k1','k2','tk1','tk2'])if(parsed[key]==null)parsed[key]=pairs[key]}parsed=refreshDerivedIOLMaster(parsed)}ocr=parsed;status.textContent='인식 완료 — 아래 값을 확인해주세요.';renderOcr()}catch(err){console.error(err);status.textContent='자동 인식에 실패했습니다. 다시 촬영하거나 직접 입력해주세요.'}});
document.getElementById('applyOcrBtn').addEventListener('click',()=>{if(ocr.al!=null)document.getElementById('al').value=ocr.al.toFixed(2);if(ocr.acd!=null)document.getElementById('acd').value=ocr.acd.toFixed(2);if(ocr.k!=null&&ocr.tk!=null&&ocr.selectedK==null){alert('K 또는 TK를 선택해주세요.');return}const kval=ocr.selectedK!=null?ocr.selectedK:(ocr.tk!=null&&ocr.k==null?ocr.tk:ocr.k);if(kval!=null){document.getElementById('k').value=kval.toFixed(2);lastKSource=ocr.selectedSource||(ocr.tk!=null&&ocr.k==null?'TK':'K')}window.scrollTo({top:0,behavior:'smooth'})});
